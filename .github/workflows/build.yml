name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # permet de lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      # Le projet n'a pas de gradlew : on installe Gradle 7.6.4,
      # compatible avec le plugin Android 7.4.2 utilisé par le projet.
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Compiler l'APK debug
        run: gradle assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ClockStf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
